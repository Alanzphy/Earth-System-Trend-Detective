[project]
name = "earth-system-trend-detective-api"
version = "0.1.0"
description = "FastAPI backend for Earth System Trend Detective"
requires-python = ">=3.12"
dependencies = [
    "estd-analysis",
    "estd-contracts",
    "estd-data",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
]

[tool.uv.sources]
estd-analysis = { workspace = true }
estd-contracts = { workspace = true }
estd-data = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
