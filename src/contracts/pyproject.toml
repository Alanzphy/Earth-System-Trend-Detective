[project]
name = "estd-contracts"
version = "0.1.0"
description = "Earth System Trend Detective: shared contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
