[project]
name = "estd-pipeline"
version = "0.1.0"
description = "Earth System Trend Detective: offline pipeline for demos and trend maps"
requires-python = ">=3.12"
dependencies = ["estd-analysis", "estd-contracts", "estd-data", "numpy>=2,<3"]

[tool.uv.sources]
estd-analysis = { workspace = true }
estd-contracts = { workspace = true }
estd-data = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
