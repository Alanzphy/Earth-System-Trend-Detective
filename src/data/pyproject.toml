[project]
name = "estd-data"
version = "0.1.0"
description = "Earth System Trend Detective: data area"
requires-python = ">=3.12"
dependencies = ["estd-contracts", "httpx>=0.27,<1", "numpy>=2,<3"]

[tool.uv.sources]
estd-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data"]
