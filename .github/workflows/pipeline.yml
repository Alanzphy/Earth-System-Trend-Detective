name: Regenerate demos and trend maps

# Manual run (Actions → "Regenerate demos and trend maps" → Run workflow).
# Downloads ~2 GB from NASA POWER (no credentials needed) and opens a PR with the new files.
on:
  workflow_dispatch:
    inputs:
      variables:
        description: "Trend-map variables (space separated catalog ids)"
        default: "temperature_2m precipitation"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ESTD_CACHE_DIR: ${{ runner.temp }}/power-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m pipeline demos
      - run: uv run python -m pipeline trend-maps ${{ inputs.variables }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: pipeline/regenerated-static-files
          title: "data: regenerate demos and trend maps"
          commit-message: "data: regenerate demos and trend maps from NASA POWER"
          body: |
            Generated by the `Regenerate demos and trend maps` workflow (`python -m pipeline`).
            Review the printed trends in the workflow log before merging.
          add-paths: |
            src/ui/public/demos/**
            src/ui/public/trend-maps/**
